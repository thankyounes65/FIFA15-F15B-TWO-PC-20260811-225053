name: Player B native observer portability self-test

on:
  push:
    branches:
      - integration/test-matchmaking-native-observer-v2
  workflow_dispatch:

jobs:
  portability:
    runs-on: windows-latest
    steps:
      - name: Check out Player B package
        uses: actions/checkout@v4

      - name: Parse scripts and forbid Git runtime dependency
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $targets = @(
            '.\VERIFY-PLAYER-B-GAME-FILES.ps1',
            '.\matchmaking-native-observer-attest.ps1',
            '.\RUN-FIFA15-F15B-NATIVE-OBSERVER.ps1'
          )
          foreach ($path in $targets) {
            $tokens = $null
            $errors = $null
            $ast = [Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              throw "$path parse failed: $((@($errors | ForEach-Object Message)) -join '; ')"
            }
            $commands = @($ast.FindAll({
              param($node)
              $node -is [Management.Automation.Language.CommandAst]
            }, $true))
            foreach ($command in $commands) {
              $name = $command.GetCommandName()
              if ($name -and $name.ToLowerInvariant() -in @('git','git.exe')) {
                throw "$path still invokes Git at runtime: $($command.Extent.Text)"
              }
            }
          }

      - name: Verify portable preflight contracts
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          .\VERIFY-PLAYER-B-GAME-FILES.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\matchmaking-native-observer-attest.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\RUN-FIFA15-F15B-NATIVE-OBSERVER.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate observer probes and classifier
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check --no-input capstone
          python .\validate-native-observer-v2-probes.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\matchmaking-native-observer-v2.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\classify-native-observer-v2-evidence.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Forbid Frida Stalker execution in the package
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          # Stalker crashed fifa15.exe inside its own RWX code cache in run
          # 20260817-001802 and must never come back. The observer's own
          # --self-test already proves the RENDERED script is Stalker-free;
          # this scans the remaining executable surface. The observer source is
          # excluded here because it legitimately NAMES Stalker in its guard
          # list and in the docstring recording why Stalker was removed.
          $files = @(Get-ChildItem -Recurse -File -Include *.js,*.ps1 |
            Where-Object { $_.FullName -notmatch 'observer-deps' })
          $hits = @($files | Select-String -Pattern 'Stalker\.follow|Stalker\.unfollow|putCallout')
          if ($hits.Count -gt 0) {
            throw "Frida Stalker reintroduced: $(($hits | ForEach-Object { $_.Path }) -join '; ')"
          }
          $table = Get-Content -LiteralPath .\fifa15-native-observer-v2-probes.json -Raw | ConvertFrom-Json
          if ($table.stalker_used -ne $false) { throw 'probe table no longer declares stalker_used=false' }
          Write-Host 'PASS: no Frida Stalker execution anywhere in the Player B package.'

      - name: Bootstrap pinned package-local Frida
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          .\RUN-FIFA15-F15B-NATIVE-OBSERVER.ps1 -DependencySelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $site = Join-Path $PWD '.observer-deps\frida-17.9.11'
          if (-not (Test-Path -LiteralPath $site -PathType Container)) {
            throw 'Pinned package-local Frida directory was not created.'
          }
          $env:PYTHONPATH = $site
          python -c "import frida,sys; print(frida.__version__); sys.exit(0 if frida.__version__ == '17.9.11' else 9)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
