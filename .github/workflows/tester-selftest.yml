name: FIFA15 remote tester self-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - name: Check out tester package
        uses: actions/checkout@v4

      - name: Run non-invasive package self-tests
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          if (Test-Path -LiteralPath '.\JOIN.key') { throw 'Public tester HEAD must not contain JOIN.key' }
          $bat = Get-Content -LiteralPath '.\RUN-FIFA15-F15B.bat' -Raw
          if ($bat -notmatch 'tailscale-bootstrap\.ps1') { throw 'RUN BAT must bootstrap missing Tailscale' }
          if ($bat -notmatch 'loopback-relay-forwarder\.ps1.*-Start') { throw 'RUN BAT must start the remote QoS/FUT loopback forwarder' }
          if ($bat -notmatch 'diagnostic-run\.ps1') { throw 'RUN BAT must enter through diagnostic-run.ps1' }
          .\tailscale-bootstrap.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tailscale-preflight.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\loopback-relay-forwarder.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            .\loopback-relay-forwarder.ps1 -Start
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $forwarded = @(Get-NetTCPConnection -LocalAddress '127.0.0.1' -State Listen -ErrorAction Stop | Where-Object { $_.LocalPort -in @(17502,17503) })
            $ports = @($forwarded.LocalPort | Sort-Object -Unique)
            if ($ports.Count -ne 2 -or 17502 -notin $ports -or 17503 -notin $ports) { throw 'Forwarder did not own both required loopback ports.' }
          } finally {
            .\loopback-relay-forwarder.ps1 -Stop
          }
          .\diagnostic-run.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\launch-safe.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\safe-run.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
