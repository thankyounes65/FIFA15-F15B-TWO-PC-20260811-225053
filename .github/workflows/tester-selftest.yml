name: FIFA15 remote tester self-test

on:
  push:
    branches:
      - main
      - diagnostic/matchmaking-scenario-suite-20260816
  workflow_dispatch:

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - name: Check out tester package
        uses: actions/checkout@v4

      - name: Run non-invasive v15 package self-tests
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath '.\JOIN.key') { throw 'Public tester HEAD must not contain JOIN.key' }

          foreach ($required in @(
            '.\README-FIRST.txt',
            '.\PLAYER-B-BOOT-AND-CONNECT.md',
            '.\PLAYER-B-KNOWN-GOOD.json',
            '.\VERIFY-PLAYER-B-GAME-FILES.ps1',
            '.\VERIFY-PLAYER-B-GAME-FILES.bat',
            '.\collect-evidence.ps1',
            '.\collect-evidence-v15.ps1',
            '.\guest-network-observer.ps1',
            '.\diagnostic-run.ps1',
            '.\matchmaking-v15-gsu-npsi-attest.ps1',
            '.\MATCHMAKING-SCENARIO-SUITE.json',
            '.\RUN-FIFA15-F15B-SCENARIO.ps1',
            '.\matchmaking-scenario-suite-attest.ps1',
            '.\PLAYER-B-SCENARIO-EVIDENCE.md',
            '.\RUN-FIFA15-F15B.bat'
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "missing Player B v15 file: $required" }
          }

          $known = Get-Content -LiteralPath '.\PLAYER-B-KNOWN-GOOD.json' -Raw | ConvertFrom-Json
          if ([int]$known.format -ne 1) { throw 'Unsupported PLAYER-B-KNOWN-GOOD.json format' }
          if ([string]$known.package.guest_runtime_revision -notmatch 'ea-readiness-v1') { throw 'Known-good contract lost EA readiness revision' }
          $forwardPorts = @($known.network.guest_loopback_forwarders | ForEach-Object { [int](($_.local -split ':')[-1]) } | Sort-Object -Unique)
          if ($forwardPorts.Count -ne 2 -or 17502 -notin $forwardPorts -or 17503 -notin $forwardPorts) { throw 'Known-good contract must pin only the two proven guest loopback forward ports' }

          $candidate = 'FIFA15-MM-V15-GSU-NPSI'
          $package = 'F15B-GITHUB-KNOWN-GOOD-20260815-V15-GSU-NPSI-1'
          $branch = 'integration/test-matchmaking-gsu-npsi-v15'
          $build = 'build_pairing_gsu_npsi_v15.rs'
          $revision = 'ea-readiness-v1+loopback-forwarder-17502-17503+matchmaking-v15-gsu-npsi-evidence1'

          $config = Get-Content -LiteralPath '.\APPLIANCE-CONFIG.json' -Raw | ConvertFrom-Json
          if ([string]$config.candidate_id -ne $candidate) { throw 'Config lost v15 candidate id' }
          if ([string]$config.package_attestation -ne $package) { throw 'Config lost v15 package attestation' }
          if ([string]$config.expected_host_branch -ne $branch) { throw 'Config lost expected v15 A branch' }
          if ([string]$config.expected_host_build -ne $build) { throw 'Config lost expected v15 A build' }
          if ([int]$config.attestation_gate_port -ne 48216) { throw 'Config lost candidate gate port 48216' }

          $manifest = Get-Content -LiteralPath '.\PACKAGE-MANIFEST.json' -Raw | ConvertFrom-Json
          if ([string]$manifest.package_revision -ne $revision) { throw 'Manifest lost v15 package revision' }
          if ([string]$manifest.matchmaking_overlay.candidate_id -ne $candidate) { throw 'Manifest candidate mismatch' }
          if ([string]$manifest.matchmaking_overlay.package_attestation -ne $package) { throw 'Manifest package mismatch' }
          if ([string]$manifest.matchmaking_overlay.expected_host_branch -ne $branch) { throw 'Manifest branch mismatch' }
          if ([string]$manifest.matchmaking_overlay.expected_host_build -ne $build) { throw 'Manifest build mismatch' }
          if (-not [bool]$manifest.matchmaking_overlay.exact_attempt_evidence_binding) { throw 'Manifest must require exact-attempt evidence binding' }
          if ([bool]$manifest.matchmaking_overlay.requires_git_checkout) { throw 'Portable Player B package must not require .git' }

          $bat = Get-Content -LiteralPath '.\RUN-FIFA15-F15B.bat' -Raw
          foreach ($marker in @(
            $candidate,
            $package,
            $branch,
            $build,
            'matchmaking-v15-gsu-npsi-attest.ps1',
            'guest-network-observer.ps1" -Start',
            'guest-network-observer.ps1" -Stop -AppendToNewestDiag',
            'diagnostic-run.ps1',
            'collect-evidence-v15.ps1" -DiagPath',
            'goto :finalize',
            'FIFA 15 F15B v15 exact-attempt diagnostic',
            'FIFA15-F15B-EVIDENCE-'
          )) {
            if (-not $bat.Contains($marker)) { throw "RUN BAT missing v15 marker: $marker" }
          }
          if ($bat.Contains('FIFA15-MM-V14-0X0B')) { throw 'RUN BAT retained stale v14 candidate' }
          if ($bat.Contains('matchmaking-v14-0x0b-attest.ps1')) { throw 'RUN BAT retained stale v14 attestation' }

          $binder = Get-Content -LiteralPath '.\collect-evidence-v15.ps1' -Raw
          foreach ($marker in @('collection_bound_diag','LastWriteTimeUtc','collect-evidence.ps1','-DesktopPath')) {
            if (-not $binder.Contains($marker)) { throw "v15 evidence binder missing marker: $marker" }
          }

          .\VERIFY-PLAYER-B-GAME-FILES.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tailscale-bootstrap.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tailscale-preflight.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\matchmaking-v15-gsu-npsi-attest.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\loopback-relay-forwarder.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            .\loopback-relay-forwarder.ps1 -Start
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $forwarded = @(Get-NetTCPConnection -LocalAddress '127.0.0.1' -State Listen -ErrorAction Stop | Where-Object { $_.LocalPort -in @(17502,17503) })
            $ports = @($forwarded.LocalPort | Sort-Object -Unique)
            if ($ports.Count -ne 2 -or 17502 -notin $ports -or 17503 -notin $ports) { throw 'Forwarder did not own both required loopback ports.' }
          } finally {
            .\loopback-relay-forwarder.ps1 -Stop
          }
          .\guest-network-observer.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\diagnostic-run.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\collect-evidence.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\collect-evidence-v15.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\launch-safe.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\safe-run.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\matchmaking-scenario-suite-attest.ps1 -All
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($scenario in 1..4) {
            $env:SCENARIO_ID = [string]$scenario
            .\matchmaking-scenario-suite-attest.ps1 -Scenario $scenario -SelfTest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
