name: FIFA15 remote tester self-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - name: Check out tester package
        uses: actions/checkout@v4

      - name: Run non-invasive package self-tests
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          .\tailscale-preflight.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\safe-run.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
