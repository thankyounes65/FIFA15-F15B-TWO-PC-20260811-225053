name: FIFA15 remote tester self-test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - name: Check out tester package
        uses: actions/checkout@v4

      - name: Run non-invasive package self-tests
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          if (Test-Path -LiteralPath '.\JOIN.key') { throw 'Public tester HEAD must not contain JOIN.key' }

          foreach ($required in @(
            '.\README-FIRST.txt',
            '.\PLAYER-B-BOOT-AND-CONNECT.md',
            '.\PLAYER-B-KNOWN-GOOD.json',
            '.\VERIFY-PLAYER-B-GAME-FILES.ps1',
            '.\VERIFY-PLAYER-B-GAME-FILES.bat',
            '.\collect-evidence.ps1',
            '.\guest-network-observer.ps1'
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "missing Player B reconstruction file: $required" }
          }

          $known = Get-Content -LiteralPath '.\PLAYER-B-KNOWN-GOOD.json' -Raw | ConvertFrom-Json
          if ([int]$known.format -ne 1) { throw 'Unsupported PLAYER-B-KNOWN-GOOD.json format' }
          if ([string]$known.package.guest_runtime_revision -notmatch 'ea-readiness-v1') { throw 'Known-good contract lost EA readiness revision' }
          $forwardPorts = @($known.network.guest_loopback_forwarders | ForEach-Object { [int](($_.local -split ':')[-1]) } | Sort-Object -Unique)
          if ($forwardPorts.Count -ne 2 -or 17502 -notin $forwardPorts -or 17503 -notin $forwardPorts) { throw 'Known-good contract must pin only the two proven guest loopback forward ports' }

          $readme = Get-Content -LiteralPath '.\README-FIRST.txt' -Raw
          foreach ($marker in @('PLAYER-B-BOOT-AND-CONNECT.md','VERIFY-PLAYER-B-GAME-FILES.bat','F15B_LOOPBACK_FORWARDER_READY','hold that state stable for 10 seconds')) {
            if (-not $readme.Contains($marker)) { throw "README missing working-state marker: $marker" }
          }

          $bat = Get-Content -LiteralPath '.\RUN-FIFA15-F15B.bat' -Raw
          if ($bat -notmatch 'tailscale-bootstrap\.ps1') { throw 'RUN BAT must bootstrap missing Tailscale' }
          if ($bat -notmatch 'loopback-relay-forwarder\.ps1.*-Start') { throw 'RUN BAT must start the remote QoS/FUT loopback forwarder' }
          if ($bat -notmatch 'guest-network-observer\.ps1.*-Start') { throw 'RUN BAT must arm the passive LSX/Blaze observer before FIFA' }
          if ($bat -notmatch 'guest-network-observer\.ps1.*-Stop.*-AppendToNewestDiag') { throw 'RUN BAT must append LSX/Blaze observation to the diagnostic evidence' }
          if ($bat -notmatch 'diagnostic-run\.ps1') { throw 'RUN BAT must enter through diagnostic-run.ps1' }
          if ($bat -notmatch 'collect-evidence\.ps1') { throw 'RUN BAT must create the one-file Player B evidence bundle' }
          if ($bat -notmatch 'FIFA15-F15B-EVIDENCE-') { throw 'RUN BAT must tell Player B to send the evidence ZIP' }

          .\VERIFY-PLAYER-B-GAME-FILES.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tailscale-bootstrap.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tailscale-preflight.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\loopback-relay-forwarder.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            .\loopback-relay-forwarder.ps1 -Start
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $forwarded = @(Get-NetTCPConnection -LocalAddress '127.0.0.1' -State Listen -ErrorAction Stop | Where-Object { $_.LocalPort -in @(17502,17503) })
            $ports = @($forwarded.LocalPort | Sort-Object -Unique)
            if ($ports.Count -ne 2 -or 17502 -notin $ports -or 17503 -notin $ports) { throw 'Forwarder did not own both required loopback ports.' }
          } finally {
            .\loopback-relay-forwarder.ps1 -Stop
          }
          .\guest-network-observer.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\diagnostic-run.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\collect-evidence.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\launch-safe.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\safe-run.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
