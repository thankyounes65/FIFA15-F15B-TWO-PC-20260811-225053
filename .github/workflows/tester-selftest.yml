name: FIFA15 remote tester self-test

# Candidate-agnostic on purpose. The previous version hardcoded one candidate id,
# package token, host branch and build, so every new experiment either broke this
# workflow or quietly left it asserting a retired package. Identity is now read
# from APPLIANCE-CONFIG.json, and every other file that states it must agree.

on:
  push:
    branches:
      - main
      - 'integration/**'
      - 'diagnostic/**'
  workflow_dispatch:

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - name: Check out tester package
        uses: actions/checkout@v4

      - name: Package identity agrees in every file that states it
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath '.\JOIN.key') { throw 'Public tester HEAD must not contain JOIN.key' }

          foreach ($required in @(
            '.\README-FIRST.txt',
            '.\RUNTIME-TEST.md',
            '.\PLAYER-B-BOOT-AND-CONNECT.md',
            '.\PLAYER-B-KNOWN-GOOD.json',
            '.\APPLIANCE-CONFIG.json',
            '.\PACKAGE-MANIFEST.json',
            '.\RUN-FIFA15-F15B.bat',
            '.\VERIFY-PLAYER-B-GAME-FILES.ps1',
            '.\VERIFY-PLAYER-B-GAME-FILES.bat',
            '.\COLLECT-PLAYER-B-EVIDENCE.ps1',
            '.\guest-network-observer.ps1',
            '.\loopback-relay-forwarder.ps1',
            '.\diagnostic-run.ps1'
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "missing Player B file: $required" }
          }

          $config = Get-Content -LiteralPath '.\APPLIANCE-CONFIG.json' -Raw | ConvertFrom-Json
          $candidate = [string]$config.candidate_id
          $package = [string]$config.package_attestation
          $branch = [string]$config.expected_host_branch
          $build = [string]$config.expected_host_build
          foreach ($field in @('candidate_id', 'package_attestation', 'expected_host_branch', 'expected_host_build')) {
            if (-not [string]$config.$field) { throw "APPLIANCE-CONFIG.json has no $field" }
          }
          if ([int]$config.attestation_gate_port -ne 48216) { throw 'Config lost candidate gate port 48216' }
          Write-Host "candidate=$candidate package=$package branch=$branch build=$build"

          $overlay = (Get-Content -LiteralPath '.\PACKAGE-MANIFEST.json' -Raw | ConvertFrom-Json).matchmaking_overlay
          if ([string]$overlay.candidate_id -ne $candidate) { throw 'PACKAGE-MANIFEST candidate mismatch' }
          if ([string]$overlay.package_attestation -ne $package) { throw 'PACKAGE-MANIFEST package mismatch' }
          if ([string]$overlay.expected_host_branch -ne $branch) { throw 'PACKAGE-MANIFEST host branch mismatch' }
          if ([string]$overlay.expected_host_build -ne $build) { throw 'PACKAGE-MANIFEST host build mismatch' }
          if ([int]$overlay.gate_port -ne 48216) { throw 'PACKAGE-MANIFEST lost candidate gate port 48216' }
          if (-not [bool]$overlay.exact_attempt_evidence_binding) { throw 'Manifest must require exact-attempt evidence binding' }
          if ([bool]$overlay.requires_git_checkout) { throw 'Portable Player B package must not require .git' }

          # Every operator-facing document must name the SAME candidate. This is
          # the check a stale README-FIRST.txt used to walk straight past.
          foreach ($doc in @('.\RUNTIME-TEST.md', '.\README-FIRST.txt')) {
            $text = Get-Content -LiteralPath $doc -Raw
            foreach ($token in @($candidate, $package, $branch, $build)) {
              if (-not $text.Contains($token)) { throw "$doc does not state the current $token" }
            }
          }

          # The launcher must reach a runner that pins this same identity.
          $bat = Get-Content -LiteralPath '.\RUN-FIFA15-F15B.bat' -Raw
          $runnerMatch = [regex]::Match($bat, 'RUN-FIFA15-F15B[-A-Za-z0-9]*\.ps1')
          if (-not $runnerMatch.Success) { throw 'RUN-FIFA15-F15B.bat does not invoke a Player B runner script' }
          $runner = ".\$($runnerMatch.Value)"
          if (-not (Test-Path -LiteralPath $runner -PathType Leaf)) { throw "RUN BAT names a missing runner: $runner" }
          $runnerText = Get-Content -LiteralPath $runner -Raw
          foreach ($token in @($candidate, $package, $branch)) {
            if (-not $runnerText.Contains($token)) { throw "$runner does not pin $token" }
          }
          "PLAYER_B_RUNNER=$runner" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # A package that declares no instrumentation must contain none.
          if (-not [bool]$overlay.frida_used -and -not [bool]$overlay.stalker_used) {
            foreach ($file in @(Get-ChildItem -Path '.' -Filter '*.ps1' -File)) {
              $t = Get-Content -LiteralPath $file.FullName -Raw
              foreach ($banned in @(('Interceptor' + '.attach'), ('Stalker' + '.follow'))) {
                if ($t.Contains($banned)) { throw "$($file.Name) reintroduced in-process instrumentation: $banned" }
              }
            }
          }

          $known = Get-Content -LiteralPath '.\PLAYER-B-KNOWN-GOOD.json' -Raw | ConvertFrom-Json
          if ([int]$known.format -ne 1) { throw 'Unsupported PLAYER-B-KNOWN-GOOD.json format' }
          if ([string]$known.package.guest_runtime_revision -notmatch 'ea-readiness-v1') { throw 'Known-good contract lost EA readiness revision' }
          $forwardPorts = @($known.network.guest_loopback_forwarders | ForEach-Object { [int](($_.local -split ':')[-1]) } | Sort-Object -Unique)
          if ($forwardPorts.Count -ne 2 -or 17502 -notin $forwardPorts -or 17503 -notin $forwardPorts) { throw 'Known-good contract must pin only the two proven guest loopback forward ports' }

      - name: Current runner and candidate-independent stack self-tests
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          # Candidate-independent parts of the proven boot/connect stack. Retired
          # per-candidate attest scripts are deliberately NOT run here: they pin
          # experiments this package no longer is.
          foreach ($script in @(
            '.\tailscale-bootstrap.ps1',
            '.\tailscale-preflight.ps1',
            '.\loopback-relay-forwarder.ps1',
            '.\diagnostic-run.ps1',
            '.\launch-safe.ps1',
            '.\safe-run.ps1',
            '.\collect-evidence.ps1',
            '.\COLLECT-PLAYER-B-EVIDENCE.ps1'
          )) {
            if (-not (Test-Path -LiteralPath $script -PathType Leaf)) { throw "missing stack script: $script" }
            Write-Host "--- $script -SelfTest"
            & $script -SelfTest
            if ($LASTEXITCODE -ne 0) { throw "$script -SelfTest failed with $LASTEXITCODE" }
          }

          # The current runner chains the current attestation, the game-file
          # contract, the network observer and the evidence collector.
          Write-Host "--- $env:PLAYER_B_RUNNER -SelfTest"
          & $env:PLAYER_B_RUNNER -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "current Player B runner self-test failed with $LASTEXITCODE" }

      - name: Loopback forwarder owns both proven ports
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          try {
            .\loopback-relay-forwarder.ps1 -Start
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $forwarded = @(Get-NetTCPConnection -LocalAddress '127.0.0.1' -State Listen -ErrorAction Stop | Where-Object { $_.LocalPort -in @(17502,17503) })
            $ports = @($forwarded.LocalPort | Sort-Object -Unique)
            if ($ports.Count -ne 2 -or 17502 -notin $ports -or 17503 -notin $ports) { throw 'Forwarder did not own both required loopback ports.' }
          } finally {
            .\loopback-relay-forwarder.ps1 -Stop
          }
